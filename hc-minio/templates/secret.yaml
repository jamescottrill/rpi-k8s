apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.minio.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hc-minio.labels" . | nindent 4 }}
type: Opaque
data:
  rootUser: {{ .Values.rootUser | b64enc | quote }}
  rootPassword: {{ .Files.Get ".dev/minio-root-password.txt" | trim | required ".dev/minio-root-password.txt is missing — create it with the MinIO root password" | b64enc | quote }}
