{{/*
Secret key for the dedicated `iceberg-writer` MinIO user. The minio subchart's
post-job reads this via the user's existingSecret/existingSecretKey reference.
The value is sourced from a gitignored .dev/ file; it must match the same file
in hc-iceberg, which mounts these credentials into the writer pod.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: iceberg-writer-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hc-minio.labels" . | nindent 4 }}
type: Opaque
data:
  secretKey: {{ .Files.Get ".dev/iceberg-writer-secret-key.txt" | trim | required ".dev/iceberg-writer-secret-key.txt is missing — create it with the iceberg-writer secret key" | b64enc | quote }}
