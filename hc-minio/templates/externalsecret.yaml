---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.minio.existingSecret }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: {{ .Values.minio.existingSecret }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: minio/root
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iceberg-writer-keys
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: iceberg-writer-keys
    creationPolicy: Owner
  data:
    - secretKey: secretKey
      remoteRef:
        key: s3/iceberg-writer
        property: secret_key
