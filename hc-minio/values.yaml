# hc-minio — wrapper around the official MinIO community chart.
# See: https://github.com/minio/minio/tree/master/helm/minio

# -- Root user for the MinIO deployment. The password is read from
# .dev/minio-root-password.txt by templates/secret.yaml (gitignored).
rootUser: admin

# -- Values passed through to the upstream `minio` subchart.
minio:
  mode: standalone
  # -- Secret (rendered by templates/secret.yaml) holding rootUser/rootPassword.
  existingSecret: hc-minio-root
  persistence:
    enabled: true
    storageClass: longhorn
    size: 50Gi
  # Pi-tuned limits — override the chart default request of 16Gi.
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  buckets:
    - name: iceberg
      policy: none
      purge: false
  service:
    type: ClusterIP
    port: 9000
  consoleService:
    type: ClusterIP
    port: 9001

# -- Gateway API route configuration (Traefik).
route:
  enabled: true
  # -- Service names rendered by the minio subchart. With release name
  # `hc-minio` these collapse to `hc-minio` (API) and `hc-minio-console`.
  apiServiceName: hc-minio
  consoleServiceName: hc-minio-console
  hostnames:
    console:
      - minio.home.internal
      - minio.home.dev
    api:
      - s3.home.internal
      - s3.home.dev

# -- Gateway reference (Traefik).
gateway:
  name: traefik-gateway
  namespace: kube-system
