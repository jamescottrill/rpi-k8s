---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spiderfoot-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: spiderfoot-svc
      port:
        number: 5001
  tls:
    - hosts:
        - spiderfoot
