---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spiderfoot-route-internal
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: websecure
  hostnames:
    - spiderfoot.home.internal
    - spiderfoot.home.dev
  rules:
    - backendRefs:
        - name: spiderfoot-svc
          port: 5001
