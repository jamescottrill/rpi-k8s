tailnet: panga-degree.ts.net

traefik:
  namespace: kube-system
  service: hc-traefik
  gateway: traefik-gateway
  listener: tailnet
  port: 8000

protectedApps:
  - host: home
    namespace: homepage
    service: hc-homepage
    port: 3000
  - host: longhorn
    namespace: longhorn-system
    service: longhorn-frontend
    port: 80
    homepage:
      name: Longhorn
      group: Platform
      icon: longhorn.png
      description: Block storage
      pod-selector: app=longhorn-ui
  - host: pihole
    namespace: pihole
    service: pihole-web
    port: 80
    homepage:
      name: Pi-hole
      group: Home
      icon: pi-hole.png
      description: DNS and ad blocking
      pod-selector: app=pihole
  - host: homebridge
    namespace: homebridge
    service: homebridge-web
    port: 8581
    homepage:
      name: Homebridge
      group: Home
      icon: homebridge.png
      description: HomeKit bridge
      pod-selector: app=homebridge
  - host: spiderfoot
    namespace: spiderfoot
    service: spiderfoot-svc
    port: 5001
    homepage:
      name: SpiderFoot
      group: Apps
      icon: mdi-spider
      description: OSINT scanner
      pod-selector: app=spiderfoot
  - host: bb-scanner
    namespace: bug-bounty
    service: bug-bounty-bb-scanner-dashboard
    port: 80
    homepage:
      name: Bug Bounty Scanner
      group: Security
      icon: mdi-shield-search
      description: Automated vulnerability scanning and triage
      pod-selector: app.kubernetes.io/component=dashboard
  - host: openfaas
    namespace: openfaas
    service: gateway
    port: 8080
    homepage:
      name: OpenFaaS
      group: Apps
      icon: openfaas.png
      description: Serverless functions
      pod-selector: app=gateway
  - host: metabase
    namespace: metabase
    service: hc-metabase
    port: 80
    homepage:
      name: Metabase
      group: Data
      icon: metabase.png
      description: BI dashboards
      pod-selector: app=metabase,release=hc-metabase
  - host: trino
    namespace: trino
    service: hc-trino-trino
    port: 8080
    homepage:
      name: Trino
      group: Data
      icon: trino.png
      description: SQL query engine
      pod-selector: app.kubernetes.io/component=coordinator,app.kubernetes.io/instance=hc-trino,app.kubernetes.io/name=trino

oauth2-proxy:
  config:
    existingSecret: oauth2-proxy
    configFile: |-
      provider = "keycloak-oidc"
      oidc_issuer_url = "https://keycloak.panga-degree.ts.net/realms/homelab"
      scope = "openid profile email groups"
      code_challenge_method = "S256"
      email_domains = ["*"]
      allowed_groups = ["admins", "users"]
      cookie_domains = [".panga-degree.ts.net"]
      whitelist_domains = [".panga-degree.ts.net"]
      cookie_secure = true
      reverse_proxy = true
      set_xauthrequest = true
      skip_provider_button = true
      upstreams = ["static://202"]
      skip_jwt_bearer_tokens = true
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 200m
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
