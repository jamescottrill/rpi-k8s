{{- range $app := .Values.protectedApps }}
{{- /* Either a single service/port, or a routes list of {path, service, port} for apps split across services. */}}
{{- $routes := $app.routes | default (list (dict "path" "/" "service" $app.service "port" $app.port)) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- /* A Tailscale Ingress can only target a Service in its own namespace, so it lives with Traefik. */}}
  name: {{ $app.host }}-tailscale
  namespace: {{ $.Values.traefik.namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    {{- with $app.homepage }}
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: "https://{{ $app.host }}.{{ $.Values.tailnet }}"
    {{- range $k, $v := . }}
    gethomepage.dev/{{ $k }}: {{ $v | quote }}
    {{- end }}
    {{- end }}
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ $.Values.traefik.service }}
      port:
        number: {{ $.Values.traefik.port }}
  tls:
    - hosts:
        - {{ $app.host }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $app.host }}
  namespace: {{ $.Release.Namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.traefik.gateway }}
      namespace: {{ $.Values.traefik.namespace }}
      sectionName: {{ $.Values.traefik.listener }}
  hostnames:
    - {{ $app.host }}.{{ $.Values.tailnet }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - name: {{ $.Release.Name }}
          port: 80
    {{- range $routes }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path }}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth2-proxy-auth
      backendRefs:
        - name: {{ .service }}
          namespace: {{ $app.namespace }}
          port: {{ .port }}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: oauth2-proxy-{{ $app.host }}
  namespace: {{ $app.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ $.Release.Namespace }}
  to:
    {{- $services := list }}
    {{- range $routes }}{{ $services = append $services .service }}{{ end }}
    {{- range $svc := $services | uniq }}
    - group: ""
      kind: Service
      name: {{ $svc }}
    {{- end }}
{{- end }}
