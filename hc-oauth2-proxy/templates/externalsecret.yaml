---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: oauth2-proxy
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        client-id: oauth2-proxy
  data:
    - secretKey: client-secret
      remoteRef:
        key: keycloak/clients/oauth2-proxy
        property: client_secret
    - secretKey: cookie-secret
      remoteRef:
        key: oauth2-proxy/cookie
        property: cookie_secret
