{{- define "hc-keycloak.externalsecret" -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: {{ .name }}
    creationPolicy: Owner
    {{- with .labels }}
    template:
      metadata:
        labels:
          {{- toYaml . | nindent 10 }}
    {{- end }}
  data:
    {{- range $key, $ref := .data }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ index $ref 0 }}
        property: {{ index $ref 1 }}
    {{- end }}
{{- end }}
{{ include "hc-keycloak.externalsecret" (dict "name" "keycloak-admin" "namespace" .Release.Namespace "data" (dict "username" (list "keycloak/admin" "username") "password" (list "keycloak/admin" "password"))) }}
{{ include "hc-keycloak.externalsecret" (dict "name" "keycloak-user" "namespace" .Release.Namespace "data" (dict "password" (list (printf "keycloak/users/%s" .Values.user.username) "password"))) }}
{{- range .Values.clients }}
{{- /* The operator only reads client secrets carrying this label. */}}
{{ include "hc-keycloak.externalsecret" (dict "name" (printf "client-%s" .name) "namespace" $.Release.Namespace "labels" (dict "operator.keycloak.org/kind" "KeycloakOIDCClient") "data" (dict "client-secret" (list (printf "keycloak/clients/%s" .name) "client_secret"))) }}
{{- end }}
