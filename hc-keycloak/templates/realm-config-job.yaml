---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-config
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: keycloak-config-cli
          image: adorsys/keycloak-config-cli:{{ .Values.keycloakConfigCli.tag }}
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak-service:8080
            - name: KEYCLOAK_USER
              valueFrom: {secretKeyRef: {name: keycloak-bootstrap-user, key: username}}
            - name: KEYCLOAK_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-bootstrap-user, key: password}}
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 300s
            - name: IMPORT_FILES_LOCATIONS
              value: /config/*
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            - name: IMPORT_MANAGED_CLIENT
              value: no-delete
            - name: IMPORT_MANAGED_CLIENTSCOPE
              value: no-delete
            - name: USER_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-user, key: password}}
            {{- range .Values.clients }}
            - name: {{ include "hc-keycloak.clientSecretEnv" .name }}
              valueFrom: {secretKeyRef: {name: client-{{ .name }}, key: client-secret}}
            {{- end }}
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: 1000m
          volumeMounts:
            - name: realm-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
