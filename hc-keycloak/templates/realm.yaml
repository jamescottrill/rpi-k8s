---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: {{ .Values.realm }}
  namespace: {{ .Release.Namespace }}
spec:
  keycloakCRName: keycloak
  {{- /* Imported once, when the realm is first created, and never re-applied, so it holds realm-level
         settings only. Groups, the user and the groups claim scope are kept in step by the idempotent
         keycloak-config hook. clientScopes is deliberately omitted: supplying any would stop Keycloak
         creating its built-in scopes. */}}
  realm:
    realm: {{ .Values.realm }}
    displayName: Home Lab
    enabled: true
    sslRequired: external
    registrationAllowed: false
    loginWithEmailAllowed: true
    bruteForceProtected: true
