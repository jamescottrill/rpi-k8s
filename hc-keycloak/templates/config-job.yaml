---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: kcadm
          image: quay.io/keycloak/keycloak:{{ .Chart.AppVersion }}
          env:
            - name: ADMIN_USER
              valueFrom: {secretKeyRef: {name: keycloak-bootstrap-user, key: username}}
            - name: ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: keycloak-bootstrap-user, key: password}}
            - name: OPERATOR_CLIENT_ID
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: client-id}}
            - name: OPERATOR_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: keycloak-admin, key: client-secret}}
            - name: REALM
              value: {{ .Values.realm }}
            - name: CLIENTS
              value: {{ include "hc-keycloak.clientNames" . | quote }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              K=/opt/keycloak/bin/kcadm.sh
              # Keycloak and the realm import can take minutes to become ready on a Pi.
              for i in $(seq 1 60); do
                $K config credentials --server http://keycloak-service:8080 --realm master \
                  --user "$ADMIN_USER" --password "$ADMIN_PASSWORD" >/dev/null 2>&1 \
                  && $K get "realms/$REALM" >/dev/null 2>&1 && break
                echo "waiting for keycloak and realm $REALM ($i)"; sleep 10
              done
              $K get "realms/$REALM" >/dev/null

              # The operator logs in as this master-realm service account. Bootstrap only creates it on a
              # brand-new cluster, so ensure it here, keeping its secret in line with Vault.
              op_id=$($K get clients -r master -q "clientId=$OPERATOR_CLIENT_ID" --fields id --format csv --noquotes)
              if [ -z "$op_id" ]; then
                op_id=$($K create clients -r master -s "clientId=$OPERATOR_CLIENT_ID" -s enabled=true \
                  -s publicClient=false -s serviceAccountsEnabled=true -s standardFlowEnabled=false \
                  -s directAccessGrantsEnabled=false -i)
                echo "created $OPERATOR_CLIENT_ID service account"
              fi
              $K update "clients/$op_id" -r master -s "secret=$OPERATOR_CLIENT_SECRET"
              $K add-roles -r master --uusername "service-account-$OPERATOR_CLIENT_ID" --rolename admin

              # The Keycloak image has no awk, so parse the CSV with bash.
              scope_id=""
              while IFS=, read -r id name; do
                [ "$name" = groups ] && scope_id=$id
              done < <($K get client-scopes -r "$REALM" --fields id,name --format csv --noquotes)
              if [ -z "$scope_id" ]; then
                scope_id=$($K create client-scopes -r "$REALM" -s name=groups -s protocol=openid-connect \
                  -s 'attributes."include.in.token.scope"=true' -i)
                $K create "client-scopes/$scope_id/protocol-mappers/models" -r "$REALM" -s name=groups \
                  -s protocol=openid-connect -s protocolMapper=oidc-group-membership-mapper \
                  -s 'config."full.path"=false' -s 'config."claim.name"=groups' \
                  -s 'config."id.token.claim"=true' -s 'config."access.token.claim"=true' \
                  -s 'config."userinfo.token.claim"=true'
                echo "created groups client scope"
              fi
              $K update "default-default-client-scopes/$scope_id" -r "$REALM"

              for client in $CLIENTS; do
                for i in $(seq 1 30); do
                  id=$($K get clients -r "$REALM" -q "clientId=$client" --fields id --format csv --noquotes)
                  [ -n "$id" ] && break
                  echo "waiting for client $client ($i)"; sleep 10
                done
                [ -n "$id" ] || { echo "client $client never appeared"; exit 1; }
                $K update "clients/$id/default-client-scopes/$scope_id" -r "$REALM"
                echo "groups scope attached to $client"
              done
