{{- if .Values.tailscale.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openclaw.fullname" . }}-tailscale
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    tailscale.com/proxy-group: {{ .Values.tailscale.proxyGroup }}
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "OpenClaw"
    gethomepage.dev/group: "Apps"
    gethomepage.dev/icon: "mdi-robot"
    gethomepage.dev/description: "AI agent"
    gethomepage.dev/href: "https://openclaw.panga-degree.ts.net"
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=openclaw,app.kubernetes.io/name=openclaw"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ .Values.route.serviceName | default .Values.instanceName }}
      port:
        number: {{ .Values.route.servicePort }}
  tls:
    - hosts:
        - {{ .Values.tailscale.hostname }}
{{- end }}
