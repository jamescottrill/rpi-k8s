apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openclaw.fullname" . }}-config
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
data:
  {{- /* The operator rewrites this key as sorted, 2-space JSON; rendering the same form keeps ArgoCD in sync. */}}
  openclaw.json: |-
    {{- .Files.Get "openclaw.json" | fromJson | toPrettyJson | nindent 4 }}

