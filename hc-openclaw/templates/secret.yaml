apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
type: Opaque
data:
  ANTHROPIC_API_KEY: {{ .Files.Get ".dev/token.txt" | trim | b64enc | quote }}
  GEMINI_API_KEY: {{ .Files.Get ".dev/gemini.txt" | trim | b64enc | quote }}
