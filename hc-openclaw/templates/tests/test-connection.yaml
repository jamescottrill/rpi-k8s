apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "openclaw.fullname" . }}-test-instance"
  labels:
    {{- include "openclaw.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: kubectl
      image: bitnami/kubectl:latest
      command: ['kubectl']
      args: ['get', 'openclawinstance', '{{ .Values.instanceName | default (include "openclaw.fullname" .) }}', '-n', '{{ .Release.Namespace }}']
  restartPolicy: Never
  serviceAccountName: {{ include "openclaw.serviceAccountName" . }}
