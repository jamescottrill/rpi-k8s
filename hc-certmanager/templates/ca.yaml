apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-dev-ca
  namespace: {{ .Release.Namespace }}
spec:
  isCA: true
  commonName: home-dev-ca
  secretName: home-dev-ca-secret
  duration: 87600h # 10 years
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: home-dev-ca-issuer
spec:
  ca:
    secretName: home-dev-ca-secret