kube-prometheus-stack:
  grafana:
    enabled: true
    grafana.ini:
      server:
        domain: grafana.panga-degree.ts.net
        root_url: https://grafana.panga-degree.ts.net/
    route:
      main:
        enabled: true
        parentRefs:
          - name: traefik-gateway
            namespace: kube-system
            sectionName: websecure
        hostnames:
          - grafana.home.internal
          - grafana.home.dev
