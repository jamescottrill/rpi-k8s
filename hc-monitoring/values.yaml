kube-prometheus-stack:
  grafana:
    enabled: true
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc
          key: client-secret
    grafana.ini:
      server:
        domain: grafana.panga-degree.ts.net
        root_url: https://grafana.panga-degree.ts.net/
      auth.generic_oauth:
        enabled: true
        name: Keycloak
        client_id: grafana
        scopes: openid profile email groups
        auth_url: https://keycloak.panga-degree.ts.net/realms/homelab/protocol/openid-connect/auth
        token_url: https://keycloak.panga-degree.ts.net/realms/homelab/protocol/openid-connect/token
        api_url: https://keycloak.panga-degree.ts.net/realms/homelab/protocol/openid-connect/userinfo
        use_pkce: true
        allow_sign_up: true
        login_attribute_path: preferred_username
        email_attribute_path: email
        groups_attribute_path: groups
        role_attribute_path: contains(groups[*], 'admins') && 'Admin' || contains(groups[*], 'users') && 'Viewer'
        role_attribute_strict: true
    route:
      main:
        enabled: true
        parentRefs:
          - name: traefik-gateway
            namespace: kube-system
            sectionName: websecure
        hostnames:
          - grafana.home.internal
          - grafana.home.dev
  kubeApiServer:
    serviceMonitor:
      metricRelabelings:
        - action: drop
          regex: apiserver_request_duration_seconds_bucket;(0.15|0.2|0.3|0.35|0.4|0.45|0.6|0.7|0.8|0.9|1.25|1.5|1.75|2|3|3.5|4|4.5|6|7|8|9|15|25|40|50)
          sourceLabels:
            - __name__
            - le
        - action: drop
          regex: (apiserver_request_sli_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes|apiserver_watch_list_duration_seconds|etcd_request_duration_seconds|workqueue_queue_duration_seconds|workqueue_work_duration_seconds)_bucket
          sourceLabels:
            - __name__
  kubelet:
    serviceMonitor:
      metricRelabelings:
        - action: drop
          regex: (apiserver|etcd|workqueue|scheduler|storage_operation)_.+_bucket
          sourceLabels:
            - __name__
  prometheus:
    prometheusSpec:
      retention: 7d
      retentionSize: 8GB
      resources:
        requests:
          memory: 1Gi
          cpu: 200m
        limits:
          memory: 2Gi
          cpu: 1500m
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: longhorn
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
