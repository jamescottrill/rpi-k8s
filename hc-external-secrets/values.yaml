external-secrets:
  installCRDs: true
  resources:
    requests:
      memory: 64Mi
      cpu: 20m
    limits:
      memory: 256Mi
      cpu: 250m
  affinity: &avoidControlPlane
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  webhook:
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 128Mi
        cpu: 100m
    affinity: *avoidControlPlane
  certController:
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 128Mi
        cpu: 100m
    affinity: *avoidControlPlane
