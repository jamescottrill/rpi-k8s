---
apiVersion: tailscale.com/v1alpha1
kind: DNSConfig
metadata:
  name: ts-dns
spec:
  nameserver:
    service:
      clusterIP: {{ .Values.tailnetDNS.nameserverIP }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  {{- /* k3s CoreDNS imports *.server keys; pods then resolve tailnet names to the in-cluster ingress proxies. */}}
  tailnet.server: |
    {{ .Values.tailnetDNS.domain }}:53 {
      errors
      cache 30
      forward . {{ .Values.tailnetDNS.nameserverIP }}
    }
