image:
  repository: docker.home.dev/ascentric
  tag: latest
  pullPolicy: Always

schedule: "0 6 * * *"

icebergWriterUrl: "http://iceberg-writer.iceberg.svc.cluster.local"

resources:
  requests:
    memory: 128Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: 500m

successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
