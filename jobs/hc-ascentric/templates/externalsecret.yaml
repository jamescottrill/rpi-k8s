---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ascentric-credentials
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: ascentric-credentials
    creationPolicy: Owner
  data:
    - secretKey: ASCENTRIC_USERNAME
      remoteRef:
        key: ascentric/credentials
        property: ASCENTRIC_USERNAME
    - secretKey: ASCENTRIC_CLIENT_ID
      remoteRef:
        key: ascentric/credentials
        property: ASCENTRIC_USERNAME
    - secretKey: ASCENTRIC_PASSWORD
      remoteRef:
        key: ascentric/credentials
        property: ASCENTRIC_PASSWORD
    - secretKey: ICEBERG_WRITER_TOKEN
      remoteRef:
        key: iceberg/api-token
        property: token
