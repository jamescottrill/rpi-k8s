{{/*
Credentials consumed by scraper/handler.py via env vars. The Ascentric login
fields and the iceberg-writer bearer token are sourced from gitignored .dev/
files. The token must match hc-iceberg/.dev/api-token.txt.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: ascentric-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hc-ascentric.labels" . | nindent 4 }}
type: Opaque
data:
  ASCENTRIC_USERNAME:   {{ .Files.Get ".dev/ascentric-username.txt"   | trim | required ".dev/ascentric-username.txt is missing"   | b64enc | quote }}
  ASCENTRIC_PASSWORD:   {{ .Files.Get ".dev/ascentric-password.txt"   | trim | required ".dev/ascentric-password.txt is missing"   | b64enc | quote }}
  ASCENTRIC_CLIENT_ID:  {{ .Files.Get ".dev/ascentric-username.txt"   | trim | required ".dev/ascentric-username.txt is missing"   | b64enc | quote }}
  ICEBERG_WRITER_TOKEN: {{ .Files.Get ".dev/iceberg-writer-token.txt" | trim | required ".dev/iceberg-writer-token.txt is missing (copy from hc-iceberg/.dev/api-token.txt)" | b64enc | quote }}
