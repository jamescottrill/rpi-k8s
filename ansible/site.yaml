- name: Restart k3s on master node
  hosts: master
  become: yes
  tasks:
    - name: Restart k3s
      systemd:
        name: k3s
        state: restarted
      tags: k3s-restart

- name: Restart k3s on worker nodes
  hosts: k3snodes
  become: yes
  tasks:
    - name: Restart k3s
      systemd:
        name: k3s-agent
        state: restarted
      tags: k3s-restart


