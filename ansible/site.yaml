---
- hosts: all
  become: yes
  vars_files:
    - vars.yaml
  roles:
    - role: common
      tags: common


- hosts: master
  become: yes
  vars_files:
  - vars.yaml
  roles:
    - role: master
      tags: k3s

- hosts: k3snodes
  become: yes
  vars_files:
    - vars.yaml
  roles:
    - role: worker
      tags: k3s

