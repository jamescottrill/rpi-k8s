---
- name: Download k3s install script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s_install.sh
    mode: '0755'

- name: Install k3s on master node
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "--disable {{ disable_components }}"
    K3S_KUBECONFIG_MODE: "644"
  shell: /tmp/k3s_install.sh
  args:
    creates: /usr/local/bin/k3s

- name: Retrieve k3s node token
  shell: cat /var/lib/rancher/k3s/server/node-token
  register: node_token

- name: Set fact for node token
  set_fact:
    k3s_token: "{{ node_token.stdout }}"

- name: Fetch kubeconfig file to local machine
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: ./k3s.yaml
    flat: yes
  tags: fetch_kubeconfig

