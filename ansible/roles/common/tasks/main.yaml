---
- name: Update apt cache
  apt:
    update_cache: yes
- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - apt-transport-https
      - ca-certificates
    state: present
    update_cache: yes

# Layer 1: systemd pets the hardware watchdog; if the kernel or systemd hangs for
# RuntimeWatchdogSec, the SoC resets the Pi. Replaces two lineinfile tasks that shared a
# regexp, so the second overwrote RuntimeWatchdogSec and the watchdog was never armed.
- name: Check the hardware watchdog device exists
  ansible.builtin.stat:
    path: /dev/watchdog0
  register: watchdog_device
  tags: watchdog
- name: Fail if there is no hardware watchdog
  ansible.builtin.assert:
    that: watchdog_device.stat.exists
    fail_msg: /dev/watchdog0 not found; the hardware watchdog cannot be armed on this host
  tags: watchdog
- name: Gather service facts
  ansible.builtin.service_facts:
  tags: watchdog
- name: Stop the standalone watchdog daemon, which would hold the device instead of systemd
  ansible.builtin.systemd_service:
    name: watchdog
    state: stopped
    enabled: false
  when: "'watchdog.service' in ansible_facts.services"
  tags: watchdog
- name: Create the systemd manager drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: '0755'
  tags: watchdog
# Drop-ins apply in filename order across /etc and /usr/lib, and Raspberry Pi OS Trixie
# ships 40-rpi-enable-watchdog.conf (RuntimeWatchdogSec=1m), so ours sorts after it.
- name: Configure the systemd hardware watchdog
  ansible.builtin.template:
    src: watchdog.conf.j2
    dest: /etc/systemd/system.conf.d/90-watchdog.conf
    mode: '0644'
  notify: Re-execute systemd
  tags: watchdog
- name: Remove the earlier drop-in name, which the Raspberry Pi OS default overrode
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d/10-watchdog.conf
    state: absent
  notify: Re-execute systemd
  tags: watchdog

# Layer 2: reboot if k3s stays unhealthy while the OS is otherwise alive.
- name: Install the k3s health check
  ansible.builtin.copy:
    src: k3s_health_reboot.py
    dest: /usr/local/sbin/k3s-health-reboot
    mode: '0755'
  tags: watchdog
- name: Install the k3s health check service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - k3s-health-reboot.service
    - k3s-health-reboot.timer
  notify: Reload systemd units
  tags: watchdog
- name: Enable the k3s health check timer
  ansible.builtin.systemd_service:
    name: k3s-health-reboot.timer
    enabled: true
    state: started
    daemon_reload: true
  # In check mode the unit file has not been written, so systemd cannot find it yet
  ignore_errors: "{{ ansible_check_mode }}"
  tags: watchdog
- name: Make k3s directory
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'

# Registry credentials live in Vault (secret/docker-registry/regcred); ESO syncs them to the
# regcred Secret, which is read here through the kube context rather than kept in git.
- name: Read the registry credentials synced from Vault
  kubernetes.core.k8s_info:
    context: "{{ kube_context }}"
    kind: Secret
    namespace: "{{ registry_credentials_secret.namespace }}"
    name: "{{ registry_credentials_secret.name }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: regcred
  no_log: true
  tags: registries
# Before the cluster (and so the Secret) exists, leave registries.yaml alone rather than fail
- name: Warn when the registry credentials are not available yet
  ansible.builtin.debug:
    msg: "{{ registry_credentials_secret.namespace }}/{{ registry_credentials_secret.name }} not found; skipping registries.yaml"
  when: regcred.resources | length == 0
  run_once: true
  tags: registries
- name: Create registries.yaml file
  ansible.builtin.template:
    src: templates/registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    mode: '0600'
  vars:
    registry_auth: "{{ (regcred.resources[0].data['.dockerconfigjson'] | b64decode | from_json).auths[registry_hosts[0]] }}"
  when: regcred.resources | length > 0
  # The diff would show the password
  diff: false
  notify: Restart k3s
  tags: registries
