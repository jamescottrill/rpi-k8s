---
- name: Re-execute systemd
  ansible.builtin.systemd_service:
    daemon_reexec: true
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
# k3s only rewrites containerd's registry config when it starts
- name: Restart k3s
  ansible.builtin.systemd_service:
    name: "{{ 'k3s' if inventory_hostname in groups['master'] else 'k3s-agent' }}"
    state: restarted
