k3s_version: "v1.34.3+k3s1"
disable_components: 'servicelb,traefik'
# Soft taint: keeps ordinary pods off the control plane but lets per-node DaemonSets
# (Longhorn holds replicas on rpi1) keep running there.
master_node_taint: 'node-role.kubernetes.io/control-plane:PreferNoSchedule'
# Hardware watchdog: reset the Pi if systemd hangs this long (RuntimeWatchdogSec).
watchdog_runtime_sec: 15
watchdog_reboot_timeout: 2min
# k3s health check: reboot after this many consecutive failed one-minute checks,
# never within the boot grace period, and at most once per interval.
k3s_health_failure_threshold: 5
k3s_health_boot_grace_sec: 900
k3s_health_min_reboot_interval_sec: 3600
