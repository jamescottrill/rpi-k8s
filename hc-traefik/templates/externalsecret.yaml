---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ssl-cert
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: ssl-cert
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: traefik/ssl-cert
