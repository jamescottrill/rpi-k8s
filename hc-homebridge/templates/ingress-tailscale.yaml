---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homebridge-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Homebridge"
    gethomepage.dev/group: "Home"
    gethomepage.dev/icon: "homebridge.png"
    gethomepage.dev/description: "HomeKit bridge"
    gethomepage.dev/href: "https://homebridge.panga-degree.ts.net"
    gethomepage.dev/pod-selector: "app=homebridge"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: homebridge-web
      port:
        number: 8581
  tls:
    - hosts:
        - homebridge
