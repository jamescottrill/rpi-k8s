---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homebridge-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: homebridge-web
      port:
        number: 8581
  tls:
    - hosts:
        - homebridge
