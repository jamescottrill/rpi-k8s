---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole-route-internal
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: websecure
  hostnames:
    - pihole.home.internal
    - pihole.home.dev
  rules:
    - backendRefs:
        - name: pihole-web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: default-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - namespace: {{ .Release.Namespace }}
      name: {{ .Values.gateway.name }}
      sectionName: dns-tcp
  rules:
    - backendRefs:
        - name: pihole-svc
          namespace: pihole
          port: 53