---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Pi-hole"
    gethomepage.dev/group: "Home"
    gethomepage.dev/icon: "pi-hole.png"
    gethomepage.dev/description: "DNS and ad blocking"
    gethomepage.dev/href: "https://pihole.panga-degree.ts.net"
    gethomepage.dev/pod-selector: "app=pihole"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: pihole-web
      port:
        number: 80
  tls:
    - hosts:
        - pihole
