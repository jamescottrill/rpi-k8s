---
apiVersion: v1
kind: Pod
metadata:
  name: no-seccomp
  namespace: apps
spec:

  containers:
    - name: app
      image: nginx:1

---
apiVersion: v1
kind: Pod
metadata:
  name: own-seccomp
  namespace: apps
spec:
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: custom.json
  containers:
    - name: app
      image: nginx:1

