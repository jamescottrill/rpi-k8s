---
apiVersion: v1
kind: Pod
metadata:
  name: no-token
  namespace: apps
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: nginx:1

---
apiVersion: v1
kind: Pod
metadata:
  name: implicit-token
  namespace: apps
spec:

  containers:
    - name: app
      image: nginx:1

