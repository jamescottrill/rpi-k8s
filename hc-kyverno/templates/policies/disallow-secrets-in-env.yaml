apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-secrets-in-env
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    cis.benchmark/controls: "5.4.1"
    policies.kyverno.io/title: Disallow Secrets as environment variables
    policies.kyverno.io/category: CIS Benchmark (Secrets)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      CIS 5.4.1: Secrets should be mounted as files rather than exposed as environment variables, which leak into logs, crash dumps and child processes.
spec:
  validationActions: [Audit]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c,
          c.?env.orValue([]).all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef)) &&
          c.?envFrom.orValue([]).all(e, !has(e.secretRef)))
      message: Mount Secrets as volumes instead of reading them into environment variables (CIS 5.4.1).
