apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    policies.kyverno.io/title: Disallow latest image tags
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Images must name an explicit tag other than latest, or a digest, so that a restart cannot silently pull different code.
spec:
  validationActions: [Audit]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    # A tag is the text after the last ':' that is not followed by a '/', so a
    # registry port such as host:5000/app is not mistaken for a tag.
    - expression: >-
        variables.allContainers.all(c,
          c.image.contains('@sha256:') ||
          (c.image.matches(':[^/:]+$') && !c.image.endsWith(':latest')))
      message: Pin every image to an explicit tag other than latest, or to a digest.
