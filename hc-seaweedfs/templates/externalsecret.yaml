---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3-config
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: seaweedfs-s3-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- /* ESO renders this template, so its delimiters must pass through Helm untouched. */}}
        seaweedfs_s3_config: |
          {{`{
            "identities": [
              {
                "name": "admin",
                "credentials": [{"accessKey": "{{ .admin_access_key }}", "secretKey": "{{ .admin_secret_key }}"}],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]
              },
              {
                "name": "iceberg-writer",
                "credentials": [{"accessKey": "{{ .writer_access_key }}", "secretKey": "{{ .writer_secret_key }}"}],
                "actions": ["Read:iceberg", "Write:iceberg", "List:iceberg", "Tagging:iceberg"]
              }
            ]
          }`}}
  data:
    - secretKey: admin_access_key
      remoteRef:
        key: seaweedfs/admin
        property: access_key
    - secretKey: admin_secret_key
      remoteRef:
        key: seaweedfs/admin
        property: secret_key
    - secretKey: writer_access_key
      remoteRef:
        key: s3/iceberg-writer
        property: access_key
    - secretKey: writer_secret_key
      remoteRef:
        key: s3/iceberg-writer
        property: secret_key
