---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "SeaweedFS S3"
    gethomepage.dev/group: "Data"
    gethomepage.dev/icon: "mdi-bucket"
    gethomepage.dev/description: "Object storage"
    gethomepage.dev/href: "https://s3.panga-degree.ts.net"
    gethomepage.dev/pod-selector: "app.kubernetes.io/component=filer,app.kubernetes.io/instance=hc-seaweedfs,app.kubernetes.io/name=seaweedfs"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ .Release.Name }}-s3
      port:
        number: 8333
  tls:
    - hosts:
        - s3
