---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ .Release.Name }}-s3
      port:
        number: 8333
  tls:
    - hosts:
        - s3
