gateway:
  name: traefik-gateway
  namespace: traefik

trino:

  server:
    workers: 0

  additionalConfigProperties:
    - node-scheduler.include-coordinator=true
    - http-server.process-forwarded=true

  coordinator:
    deployment:
      strategy:
        type: Recreate
    jvm:
      maxHeapSize: "2G"
    # Sized from 7-day peaks (Nov 2026): ~1.35Gi working set, p99 CPU ~11m.
    # Memory limit must stay above maxHeapSize plus JVM overhead. No CPU
    # limit, so queries can burst into idle cores.
    resources:
      requests:
        memory: 1400Mi
        cpu: 100m
      limits:
        memory: 3Gi

    startupProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 60
      timeoutSeconds: 5
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  catalogs:
    iceberg: |
      connector.name=iceberg
      iceberg.catalog.type=nessie
      iceberg.nessie-catalog.uri=http://hc-nessie.nessie.svc.cluster.local:19120/api/v1
      iceberg.nessie-catalog.default-warehouse-dir=s3://iceberg
      fs.native-s3.enabled=true
      s3.endpoint=http://hc-seaweedfs-s3.seaweedfs.svc.cluster.local:8333
      s3.region=us-east-1
      s3.path-style-access=true
      s3.aws-access-key=${ENV:S3_ACCESS_KEY}
      s3.aws-secret-key=${ENV:S3_SECRET_KEY}

  service:
    type: ClusterIP

  envFrom:
    - secretRef:
        name: trino-s3-creds
