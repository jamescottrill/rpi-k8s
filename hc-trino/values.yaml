gateway:
  name: traefik-gateway
  namespace: kube-system

trino:

  server:
    workers: 0

  additionalConfigProperties:
    - node-scheduler.include-coordinator=true
    - http-server.process-forwarded=true

  coordinator:
    deployment:
      strategy:
        type: Recreate
    jvm:
      maxHeapSize: "2G"
    resources:
      requests:
        memory: 1Gi
        cpu: 250m
      limits:
        memory: 3Gi
        cpu: 1500m

    startupProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 60
      timeoutSeconds: 5
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

  catalogs:
    iceberg: |
      connector.name=iceberg
      iceberg.catalog.type=nessie
      iceberg.nessie-catalog.uri=http://hc-nessie.nessie.svc.cluster.local:19120/api/v1
      iceberg.nessie-catalog.default-warehouse-dir=s3://iceberg
      fs.native-s3.enabled=true
      s3.endpoint=http://hc-minio.minio.svc.cluster.local:9000
      s3.region=us-east-1
      s3.path-style-access=true
      s3.aws-access-key=${ENV:S3_ACCESS_KEY}
      s3.aws-secret-key=${ENV:S3_SECRET_KEY}

  service:
    type: ClusterIP

  envFrom:
    - secretRef:
        name: trino-s3-creds
