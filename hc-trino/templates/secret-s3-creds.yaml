{{/*
MinIO credentials injected into the Trino coordinator as env vars. The
iceberg catalog config references S3_ACCESS_KEY / S3_SECRET_KEY using
${ENV:...} interpolation.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: trino-s3-creds
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  # Keys become env var names verbatim under `envFrom: secretRef`, so use
  # shell-friendly UPPER_SNAKE_CASE — Trino's ${ENV:NAME} resolver chokes on
  # hyphenated names.
  S3_ACCESS_KEY: {{ "iceberg-writer" | b64enc | quote }}
  S3_SECRET_KEY: {{ .Files.Get ".dev/iceberg-writer-secret-key.txt" | trim | required ".dev/iceberg-writer-secret-key.txt is missing (copy from hc-iceberg/.dev/)" | b64enc | quote }}
