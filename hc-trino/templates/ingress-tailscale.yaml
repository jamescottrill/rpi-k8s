---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trino-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hc-trino-trino
      port:
        number: 8080
  tls:
    - hosts:
        - trino
