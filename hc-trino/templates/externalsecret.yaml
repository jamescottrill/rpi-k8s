---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trino-s3-creds
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: trino-s3-creds
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: s3/iceberg-writer
        property: access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: s3/iceberg-writer
        property: secret_key
