---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      metadata:
        labels:
          {{- /* Argo CD only resolves $<secret>:<key> references in Secrets carrying this label. */}}
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef:
        key: keycloak/clients/argocd
        property: client_secret
