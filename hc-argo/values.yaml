argo-cd:
  redis-ha:
    enabled: false
  global:
    domain: argocd.panga-degree.ts.net
  server:
    ingress:
      enabled: false
  configs:
    params:
      server.insecure: true
      controller.diff.server.side: "true"
      reposerver.enable.git.submodule: "false"
      applicationsetcontroller.enable.git.submodule: "false"
  extraObjects:
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: argocd-tailscale
        namespace: argo
        annotations:
          tailscale.com/proxy-group: ingress-proxies
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Argo CD"
          gethomepage.dev/group: "Platform"
          gethomepage.dev/icon: "argo-cd.png"
          gethomepage.dev/description: "GitOps deployments"
          gethomepage.dev/href: "https://argocd.panga-degree.ts.net"
          gethomepage.dev/pod-selector: "app.kubernetes.io/instance=hc-argo,app.kubernetes.io/name=argocd-server"
      spec:
        ingressClassName: tailscale
        defaultBackend:
          service:
            name: hc-argo-argocd-server
            port:
              number: 80
        tls:
          - hosts:
              - argocd
