argo-cd:
  redis-ha:
    enabled: false
  dex:
    enabled: false
  global:
    domain: argocd.panga-degree.ts.net
  server:
    ingress:
      enabled: false
  configs:
    params:
      server.insecure: true
      controller.diff.server.side: "true"
      reposerver.enable.git.submodule: "false"
      applicationsetcontroller.enable.git.submodule: "false"
    cm:
      oidc.config: |
        name: Keycloak
        issuer: https://keycloak.panga-degree.ts.net/realms/homelab
        clientID: argocd
        clientSecret: $argocd-oidc:clientSecret
        requestedScopes: ["openid", "profile", "email", "groups"]
    rbac:
      policy.default: ""
      scopes: "[groups]"
      policy.csv: |
        g, admins, role:admin
        g, users, role:readonly
  extraObjects:
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: argocd-tailscale
        namespace: argo
        annotations:
          tailscale.com/proxy-group: ingress-proxies
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: "Argo CD"
          gethomepage.dev/group: "Platform"
          gethomepage.dev/icon: "argo-cd.png"
          gethomepage.dev/description: "GitOps deployments"
          gethomepage.dev/href: "https://argocd.panga-degree.ts.net"
          gethomepage.dev/pod-selector: "app.kubernetes.io/instance=hc-argo,app.kubernetes.io/name=argocd-server"
      spec:
        ingressClassName: tailscale
        defaultBackend:
          service:
            name: hc-argo-argocd-server
            port:
              number: 80
        tls:
          - hosts:
              - argocd
