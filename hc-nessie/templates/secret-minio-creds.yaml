{{/*
MinIO credentials used by Nessie's Iceberg REST catalog service when vending
S3 access to clients (iceberg-writer, Trino). Same `iceberg-writer` MinIO
user as hc-iceberg uses; the secret key is sourced from a gitignored
.dev/ file copied across from hc-iceberg.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: nessie-minio-creds
  namespace: {{ .Release.Namespace }}
type: Opaque
data:
  access-key: {{ "iceberg-writer" | b64enc | quote }}
  secret-key: {{ .Files.Get ".dev/iceberg-writer-secret-key.txt" | trim | required ".dev/iceberg-writer-secret-key.txt is missing (copy from hc-iceberg/.dev/)" | b64enc | quote }}
