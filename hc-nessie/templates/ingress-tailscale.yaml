---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nessie-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Nessie"
    gethomepage.dev/group: "Data"
    gethomepage.dev/icon: "mdi-source-branch"
    gethomepage.dev/description: "Iceberg catalog"
    gethomepage.dev/href: "https://nessie.panga-degree.ts.net"
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=hc-nessie,app.kubernetes.io/name=nessie"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hc-nessie
      port:
        number: 19120
  tls:
    - hosts:
        - nessie
