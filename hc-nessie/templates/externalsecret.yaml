---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nessie-minio-creds
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: nessie-minio-creds
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: s3/iceberg-writer
        property: access_key
    - secretKey: secret-key
      remoteRef:
        key: s3/iceberg-writer
        property: secret_key
