---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: internal-advertisement
  namespace: {{ .Release.Namespace }}
spec:
  ipAddressPools:
    - address-pool
  {{- /* ARP replies from the Wi-Fi node don't reach the LAN reliably, so only wired nodes announce. */}}
  nodeSelectors:
    - matchLabels:
        network: ethernet
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: pihole-l2
  namespace: {{ .Release.Namespace }}
spec:
  ipAddressPools:
    - address-pool
  nodeSelectors:
    - matchLabels:
        kubernetes.io/hostname: rpi3
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: address-pool
  namespace: {{ .Release.Namespace }}
spec:
  addresses:
    - {{ .Values.addressPool }}