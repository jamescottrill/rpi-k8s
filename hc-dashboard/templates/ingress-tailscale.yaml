---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: dashboard-kong-proxy
      port:
        number: 443
  tls:
    - hosts:
        - dashboard
