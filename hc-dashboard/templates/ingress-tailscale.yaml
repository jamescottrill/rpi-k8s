---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Kubernetes Dashboard"
    gethomepage.dev/group: "Platform"
    gethomepage.dev/icon: "kubernetes-dashboard.png"
    gethomepage.dev/description: "Cluster UI"
    gethomepage.dev/href: "https://dashboard.panga-degree.ts.net"
    gethomepage.dev/pod-selector: "app.kubernetes.io/component=app,app.kubernetes.io/instance=dashboard,app.kubernetes.io/name=kong"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: dashboard-kong-proxy
      port:
        number: 443
  tls:
    - hosts:
        - dashboard
