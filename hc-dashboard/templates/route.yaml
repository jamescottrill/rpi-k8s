---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard-route-internal
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{.Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: websecure
  hostnames:
    - dash.home.internal
    - dash.home.dev
  rules:
    - backendRefs:
        - name: dashboard-kubernetes-dashboard-auth
          port: 8000
      matches:
        - path:
            type: PathPrefix
            value: /api/v1/csrf/token
        - path:
            type: PathPrefix
            value: /api/v1/login
        - path:
            type: PathPrefix
            value: /api/v1/me
    - backendRefs:
        - name: dashboard-kubernetes-dashboard-api
          port: 8000
      matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /metrics
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dashboard-kubernetes-dashboard-web
          port: 8000