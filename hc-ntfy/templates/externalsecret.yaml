---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy-auth
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: ntfy-auth
    creationPolicy: Owner
  data:
    - secretKey: NTFY_AUTH_USERS
      remoteRef:
        key: {{ .Values.vault.authKey }}
        property: users
    - secretKey: NTFY_AUTH_TOKENS
      remoteRef:
        key: {{ .Values.vault.authKey }}
        property: tokens
