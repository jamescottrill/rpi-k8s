gateway:
  name: traefik-gateway
  namespace: kube-system

metabase:
  javaOpts: "-Xmx1536m -Xms512m"

  extraEnv:
    - name: MB_SITE_URL
      value: https://metabase.home.dev

  database:
    type: h2
    persistence:
      type: pvc
      enabled: true
      storageClassName: longhorn
      size: 5Gi

  resources:
    requests:
      memory: 768Mi
      cpu: 100m
    limits:
      memory: 2Gi
      cpu: 1500m

  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 180
    periodSeconds: 30
    failureThreshold: 6
    timeoutSeconds: 10
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5

  strategy:
    type: Recreate

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: false
