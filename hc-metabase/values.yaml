gateway:
  name: traefik-gateway
  namespace: kube-system
metabase:
  javaOpts: "-Xmx1536m -Xms512m"
  extraEnv:
    - name: MB_SITE_URL
      value: https://metabase.home.dev
  database:
    type: h2
    persistence:
      type: pvc
      enabled: true
      storageClassName: longhorn
      size: 5Gi
  # Sized from 7-day peaks (Nov 2026): ~1.3Gi working set, p99 CPU ~55m.
  # Memory limit must stay above -Xmx plus JVM overhead. No CPU limit, so
  # JVM start-up is not throttled; the request still sets its fair share.
  resources:
    requests:
      memory: 1400Mi
      cpu: 100m
    limits:
      memory: 2Gi
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 180
    periodSeconds: 30
    failureThreshold: 6
    timeoutSeconds: 10
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
  strategy:
    type: Recreate
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
  # The chart probes every 5s, so 360 failures gives a 30-minute start-up
  # budget. A cold start on a busy node took over 15 minutes (Nov 2026).
  startupProbe:
    failureThreshold: 360
  # Keep Metabase off rpi5: it is a 1.8 GHz Pi 4 (the others are 2.4 GHz
  # Pi 5s) and the busiest node. Moving there in Nov 2026 made Metabase
  # noticeably slower, as its H2 database is on a Longhorn volume and rpi5
  # also has the highest I/O wait. Prefer wired nodes over rpi4's wifi.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - rpi5
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: network
                operator: In
                values:
                  - ethernet
