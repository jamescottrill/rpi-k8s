gateway:
  name: traefik-gateway
  namespace: traefik
metabase:
  javaOpts: "-Xmx1536m -Xms512m"
  extraEnv:
    - name: MB_SITE_URL
      value: https://metabase.home.dev
  database:
    type: h2
    persistence:
      type: pvc
      enabled: true
      storageClassName: longhorn
      size: 5Gi
  # Sized from 7-day peaks (Nov 2026): ~1.3Gi working set, p99 CPU ~55m.
  # Memory limit must stay above -Xmx plus JVM overhead. No CPU limit, so
  # JVM start-up is not throttled; the request still sets its fair share.
  resources:
    requests:
      memory: 1400Mi
      cpu: 100m
    limits:
      memory: 2Gi
  startupProbe:
    failureThreshold: 180

  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 180
    periodSeconds: 30
    failureThreshold: 6
    timeoutSeconds: 10
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5
  strategy:
    type: Recreate
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
  startupProbe:
    failureThreshold: 180
