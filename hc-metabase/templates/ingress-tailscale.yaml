---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metabase-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: hc-metabase
      port:
        number: 80
  tls:
    - hosts:
        - metabase
