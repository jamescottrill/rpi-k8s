---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: basic-auth
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: basic-auth
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: openfaas/basic-auth
