---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openfaas-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: gateway
      port:
        number: 8080
  tls:
    - hosts:
        - openfaas
