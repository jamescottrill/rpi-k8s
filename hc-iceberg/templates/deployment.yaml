apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-writer
  namespace: {{ .Release.Namespace }}
  labels:
    app: iceberg-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iceberg-writer
  template:
    metadata:
      labels:
        app: iceberg-writer
    spec:
      containers:
        - name: iceberg-writer
          image: docker.home.dev/iceberg-writer:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            # Nessie REST catalog
            - name: NESSIE_URI
              value: "http://hc-nessie.nessie.svc.cluster.local:19120/iceberg/"
            - name: NESSIE_WAREHOUSE
              value: "iceberg"
            # SeaweedFS S3 connection (parquet + metadata files)
            - name: S3_ENDPOINT
              value: "http://hc-seaweedfs-s3.seaweedfs.svc.cluster.local:8333"
            - name: S3_BUCKET
              value: "iceberg"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: iceberg-writer-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: iceberg-writer-secrets
                  key: s3-secret-key
            # API authentication
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: iceberg-writer-secrets
                  key: api-token
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
