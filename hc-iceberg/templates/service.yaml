apiVersion: v1
kind: Service
metadata:
  name: iceberg-writer
  namespace: {{ .Release.Namespace }}
  labels:
    app: iceberg-writer
spec:
  selector:
    app: iceberg-writer
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: iceberg-writer
  namespace: {{ .Release.Namespace }}
  labels:
    app: iceberg-writer
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - iceberg-writer.home.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: iceberg-writer
          port: 80