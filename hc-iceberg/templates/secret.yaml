{{/*
Credentials for the iceberg-writer service:
  - s3-access-key / s3-secret-key — the dedicated `iceberg-writer` MinIO user
  - api-token                     — bearer token clients use to POST rows
The secret values are sourced from gitignored .dev/ files. The S3 secret key
must match hc-minio's .dev/iceberg-writer-secret-key.txt.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: iceberg-writer-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app: iceberg-writer
type: Opaque
data:
  s3-access-key: {{ .Values.s3.accessKey | b64enc | quote }}
  s3-secret-key: {{ .Files.Get ".dev/iceberg-writer-secret-key.txt" | trim | required ".dev/iceberg-writer-secret-key.txt is missing — copy it from hc-minio/.dev/" | b64enc | quote }}
  api-token: {{ .Files.Get ".dev/api-token.txt" | trim | required ".dev/api-token.txt is missing — create it with the writer API bearer token" | b64enc | quote }}
