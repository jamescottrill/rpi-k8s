---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iceberg-writer-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: iceberg-writer-secrets
    creationPolicy: Owner
  data:
    - secretKey: s3-access-key
      remoteRef:
        key: s3/iceberg-writer
        property: access_key
    - secretKey: s3-secret-key
      remoteRef:
        key: s3/iceberg-writer
        property: secret_key
    - secretKey: api-token
      remoteRef:
        key: iceberg/api-token
        property: token
