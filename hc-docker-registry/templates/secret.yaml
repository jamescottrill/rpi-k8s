kind: Secret
apiVersion: v1
metadata:
  name: docker-registry
  namespace: {{ .Release.Namespace }}
data:
  htpasswd: {{ .Values.htpasswd | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: docker-certs
data:
  tls.crt: {{ .Files.Get "lab.cloud.crt" | b64enc }}
  tls.key: {{ .Files.Get "lab.cloud.key" | b64enc }}
