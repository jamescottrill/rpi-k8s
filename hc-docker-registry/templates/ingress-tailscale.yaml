---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-registry-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: docker-registry-svc
      port:
        number: 5000
  tls:
    - hosts:
        - docker
