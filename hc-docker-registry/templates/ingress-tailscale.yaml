---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docker-registry-tailscale
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Registry"
    gethomepage.dev/group: "Platform"
    gethomepage.dev/icon: "docker.png"
    gethomepage.dev/description: "Container registry"
    gethomepage.dev/href: "https://docker.panga-degree.ts.net"
    gethomepage.dev/pod-selector: "app=docker-registry"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: docker-registry-svc
      port:
        number: 5000
  tls:
    - hosts:
        - docker
