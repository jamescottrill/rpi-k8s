gateway:
  name: traefik-gateway
  namespace: traefik
harbor:
  expose:
    type: clusterIp
    tls:
      enabled: false
dockerRegistry:
  authentication:
    htpasswd:
      realm: "Registry Realm"
  secret:
    name: docker-registry
  volumeMounts:
    - mountPath: /htpasswd
      name: htpasswd-secret
serviceAccount:
  name: sa-docker
